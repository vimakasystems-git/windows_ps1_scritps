name: Publish tested installers
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Workstation Care installers run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validate source build
        id: source
        run: |
          [[ "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID" > run.json
          python3 - <<'PY'
          import json, os, re
          r=json.load(open('run.json'))
          assert r['name']=='Workstation Care installers'
          assert r['conclusion']=='success' and r['head_branch']=='main' and r['event']=='push'
          assert r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch('[0-9a-f]{40}',r['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+r['head_sha']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: installers-*
          path: downloaded
      - name: Collect all required OS packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib, shutil, os
          v=json.loads(Path('app/package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+',v)
          Path('dist').mkdir()
          suffixes=['windows-x64.exe','linux-x64.deb','linux-x64.rpm','linux-arm64.deb','linux-arm64.rpm','macos-x64.pkg','macos-arm64.pkg']
          sums=[]
          for suffix in suffixes:
              name=f'VimakaWorkstationCare-{v}-{suffix}'
              matches=list(Path('downloaded').rglob(name))
              assert len(matches)==1, name
              target=Path('dist')/name
              shutil.copyfile(matches[0],target)
              sums.append(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+name)
          Path('dist/SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RELEASE_TAG=v'+v+'\n')
          PY
      - name: Publish only a complete draft
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json; then
            python3 - <<'PY'
          import json,os
          r=json.load(open('release.json'))
          assert r['isDraft'], 'Never replace a published release'
          assert r['targetCommitish']==os.environ['SOURCE_SHA'], 'Draft has a different source commit'
          PY
          else
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" --title "Vimaka Workstation Care $RELEASE_TAG" --notes-file app/README.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
