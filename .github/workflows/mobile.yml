name: Mobile preview tests
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'platforms/android/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test mobile/tests/*.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: platforms/android
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: cd platforms/android && gradle connectedDebugAndroidTest
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/VimakaWorkstationCare-Mobile-0.1.0-preview-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-preview
          path: dist/*.apk
