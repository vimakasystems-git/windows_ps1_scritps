name: Mobile preview tests
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'platforms/android/**', 'platforms/ios/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test mobile/tests/*.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: platforms/android
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: cd platforms/android && gradle connectedDebugAndroidTest
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/VimakaWorkstationCare-Mobile-0.1.0-preview-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-preview
          path: dist/*.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate
      - name: Test on iPhone and iPad simulators
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' > selected.txt
          import json
          devices=[d for group in json.load(open('devices.json'))['devices'].values() for d in group]
          for family in ['iPhone','iPad']:
              print(next(d['udid'] for d in devices if family in d['name']))
          PY
          while read -r device; do
            xcodebuild test -project platforms/ios/VimakaCareMobile.xcodeproj -scheme VimakaCareMobile -destination "platform=iOS Simulator,id=$device" -derivedDataPath platforms/ios/build CODE_SIGNING_ALLOWED=NO > ios-test.log 2>&1 || { tail -n 120 ios-test.log; exit 1; }
          done < selected.txt
      - name: Package simulator app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent platforms/ios/build/Build/Products/Debug-iphonesimulator/VimakaCareMobile.app dist/VimakaWorkstationCare-Mobile-0.1.0-preview-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-simulator
          path: dist/*.zip
