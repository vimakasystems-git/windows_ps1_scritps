name: Workstation Care installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci; npm test
        working-directory: app
      - name: Build Windows installer
        run: ./platforms/windows/build.ps1 -NodePath (Get-Command node.exe).Source -BuildDirectory build-ci
      - name: Test installation and update with running component
        shell: powershell
        run: |
          $setup=(Get-ChildItem app/build-ci/*.exe).FullName
          $run=Start-Process -FilePath $setup -ArgumentList '--accept-install','--background' -PassThru -Wait -WindowStyle Hidden
          if($run.ExitCode -ne 0){throw 'Install failed'}
          $session=Invoke-RestMethod http://127.0.0.1:47831/api/session
          if($session.version -ne '0.3.0'){throw 'Wrong version'}
          $root=Join-Path $env:LOCALAPPDATA 'VimakaWindowsCare'
          $sentinel=Join-Path $root 'data/install-test.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve'
          $run=Start-Process -FilePath $setup -ArgumentList '--accept-install','--background' -PassThru -Wait -WindowStyle Hidden
          if($run.ExitCode -ne 0){throw 'Update failed'}
          if(!(Test-Path -LiteralPath $sentinel)){throw 'User data lost'}
          $session=Invoke-RestMethod http://127.0.0.1:47831/api/session
          Invoke-RestMethod http://127.0.0.1:47831/api/shutdown -Method Post -ContentType application/json -Headers @{Origin='http://127.0.0.1:47831';'X-Vimaka-Token'=$session.csrf} -Body '{"confirm":true}'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x64
          path: app/build-ci/*.exe
          if-no-files-found: error
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci && npm test
        working-directory: app
      - if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm
      - name: Build native installers
        run: python3 platforms/build-installers.py --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --node "$(command -v node)"
      - if: matrix.os == 'linux'
        name: Install DEB and test bundled runtime
        run: |
          sudo apt-get install -y ./dist/*.deb
          VIMAKA_TEST_APP_DIR=/opt/vimaka-workstation-care /opt/vimaka-workstation-care/node --test app/tests/portable.test.mjs
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/app/tests:/tests:ro" fedora:latest sh -c 'dnf install -y /packages/*.rpm && VIMAKA_TEST_APP_DIR=/opt/vimaka-workstation-care /opt/vimaka-workstation-care/node --test /tests/portable.test.mjs'
      - if: matrix.os == 'macos'
        name: Install PKG and test bundled runtime
        run: |
          sudo installer -pkg dist/*.pkg -target /
          VIMAKA_TEST_APP_DIR='/Applications/Vimaka Workstation Care.app/Contents/Resources/app' '/Applications/Vimaka Workstation Care.app/Contents/Resources/app/node' --test app/tests/portable.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
          if-no-files-found: error
