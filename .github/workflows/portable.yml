name: Portable platform tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vimaka-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vimaka-windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: sh -n Start-Vimaka.command
  fedora:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate RPM inventory and diagnostic in Fedora
        run: >-
          docker run --rm -v "$PWD:/app" -w /app/vimaka-windows fedora:latest
          sh -c 'dnf install -y nodejs npm && npm ci && npm test'
