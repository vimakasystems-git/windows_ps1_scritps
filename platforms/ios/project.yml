name: VimakaCareMobile
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  VimakaCareMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../mobile/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vimaka.workstationcare.mobile
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vimaka Care Mobile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  VimakaCareMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VimakaCareMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vimaka.workstationcare.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  VimakaCareMobile:
    build:
      targets:
        VimakaCareMobile: all
    test:
      targets: [VimakaCareMobileUITests]
